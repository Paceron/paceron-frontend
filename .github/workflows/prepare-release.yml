name: Prepare Release

on:
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare-release:
    name: Cut release branch and open PR to master
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create passthrough release branch and open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin develop

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # La version se bumpea de forma incremental en cada feature/fix,
          # no aca: develop ya trae la version correcta al momento del release.
          VERSION=$(git show origin/develop:package.json | node -e "console.log(JSON.parse(require('fs').readFileSync(0,'utf8')).version)")
          RELEASE_BRANCH="release/${VERSION}"

          git checkout -b "$RELEASE_BRANCH" origin/develop
          git push origin "$RELEASE_BRANCH"

          COMMITS=$(git log origin/master..origin/develop --pretty=format:"- %s (%h)")

          gh pr create \
            --base master \
            --head "$RELEASE_BRANCH" \
            --title "release: ${VERSION}" \
            --body "$(cat <<EOF
          ## Release ${VERSION}

          Rama pasamanos desde \`develop\` (sin commits propios) — la version ya viene bumpeada de forma incremental en cada feature/fix.

          ## Cambios incluidos

          ${COMMITS}

          ---
          PR creada por \`prepare-release.yml\` (disparo manual). Revisar, esperar CI verde, y mergear a mano.
          EOF
          )"
